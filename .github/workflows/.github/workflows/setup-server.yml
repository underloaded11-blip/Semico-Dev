name: Setup Eaglercraft Server Environment

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Server Directory & Download Paper JAR
        run: |
          mkdir -p server/plugins
          cd server
          # Download Paper 1.12.2 server core (or change to your preferred version)
          curl -o server.jar https://api.papermc.io/v2/projects/paper/versions/1.12.2/builds/1620/downloads/paper-1.12.2-1620.jar
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties

      - name: Download EaglercraftXServer Plugin
        run: |
          # Automatically fetch the latest EaglercraftXServer plugin into the plugins folder
          curl -L -o server/plugins/EaglercraftXServer.jar https://github.com/lax1dude/eaglerxserver/releases/latest/download/EaglerXServer.jar

      - name: Generate Proxy Listener Configuration
        run: |
          mkdir -p server/plugins/EaglercraftXServer
          cat << 'EOF' > server/plugins/EaglercraftXServer/config.yml
          listeners:
            - address: '0.0.0.0:8081'
              public-address: 'your-tunnel-url-here:8081'
              forced-hosts:
                - 'your-tunnel-url-here'
          EOF

      - name: Verify Setup
        run: |
          echo "Server files successfully prepared!"
          ls -la server/
          ls -la server/plugins/
